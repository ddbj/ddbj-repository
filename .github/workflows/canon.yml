name: Canon
on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: canon-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ruby-fixture-pinning:
    name: Ruby fixture pinning
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4

        ports:
          - 5432:5432

        env:
          POSTGRES_DB: repository_test
          POSTGRES_HOST_AUTH_METHOD: trust

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      RAILS_ENV: test
      TZ: Asia/Tokyo

      # See .github/actions/seaweedfs.
      SEAWEEDFS_TEST_ACCESS_KEY: repository-test
      SEAWEEDFS_TEST_SECRET_KEY: repository-test-secret

    steps:
      - name: Install libvips
        run: sudo apt-get install --update --assume-yes --no-install-recommends libvips42

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Not for anything canonicalisation stores: a global setup in
      # test/test_helper.rb attaches to a fixture before every test.
      - uses: ./.github/actions/seaweedfs

      - run: bin/rails db:test:prepare

      - name: Run canonicalizer test suite
        run: bin/rails test test/models/ddbj_record/canonicalizer_test.rb test/models/ddbj_record/canon/ test/models/ddbj_record/v3_test.rb
        env:
          REQUIRE_SPEC_SUBMODULE: '1'

      - name: Verify registry coverage
        run: bin/rails canon:registry_completeness

  # DDBJRecord::V3 defines its types from schema/ddbj-record/v3.schema.json.
  # That file is generated from the spec the submodule pins, and has to be
  # regenerated whenever the submodule moves.
  spec-schema:
    name: Spec schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The spec's own locked toolchain, so a pydantic release that changes
      # how schemas are written does not fail this on an unrelated push.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Compare with the schema the pinned spec generates
        run: |
          uv run --frozen --project vendor/ddbj-record-specifications \
            python -m ddbj_record.schema.cli --version v3 | diff -u schema/ddbj-record/v3.schema.json -

  cross-lang-jcs-gate:
    name: Cross-language JCS gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4

        ports:
          - 5432:5432

        env:
          POSTGRES_DB: repository_test
          POSTGRES_HOST_AUTH_METHOD: trust

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      RAILS_ENV: test
      TZ: Asia/Tokyo

      # See .github/actions/seaweedfs.
      SEAWEEDFS_TEST_ACCESS_KEY: repository-test
      SEAWEEDFS_TEST_SECRET_KEY: repository-test-secret

    steps:
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends libvips42

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python canonicalization deps
        run: pip install rfc8785==0.1.4 jsonpatch==1.33

      - name: Expose Python interpreter to the cross-lang test
        run: echo "DDBJ_CANON_PY=$(which python)" >> "$GITHUB_ENV"

      # Not for anything canonicalisation stores: a global setup in
      # test/test_helper.rb attaches to a fixture before every test.
      - uses: ./.github/actions/seaweedfs

      - run: bin/rails db:test:prepare

      - name: Run cross-language JCS parity test
        run: bin/rails test test/models/ddbj_record/canon/cross_lang_jcs_test.rb
