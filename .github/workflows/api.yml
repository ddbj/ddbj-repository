name: API
on: push

concurrency:
  group: api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4

        ports:
          - 5432:5432

        env:
          POSTGRES_DB: repository_test
          POSTGRES_HOST_AUTH_METHOD: trust

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      RAILS_ENV: test
      TZ: Asia/Tokyo

      # Made up, and made real by .github/actions/seaweedfs, which creates the
      # test identity with exactly these.
      SEAWEEDFS_TEST_ACCESS_KEY: repository-test
      SEAWEEDFS_TEST_SECRET_KEY: repository-test-secret

    steps:
      - name: Install libvips
        run: sudo apt-get install --update --assume-yes --no-install-recommends libvips42

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The same object storage the application runs on, rather than Active
      # Storage's Disk service: multipart uploads and presigned URLs are part
      # of what is under test, and Disk has neither.
      - uses: ./.github/actions/seaweedfs

      - run: bin/rails db:test:prepare

      # `test` alone skips test/system, which is where the
      # user-perspective coverage lives. `test:all` is both.
      - run: bin/rails test:all

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github
