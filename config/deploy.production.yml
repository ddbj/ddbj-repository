servers:
  web:
    hosts:
      - repository-production

    # `--mount` rather than `--volume`, for every path that lives on
    # Lustre. A volume whose source is missing is created as an empty
    # directory on the host's local disk and the container starts
    # happily; a mount whose source is missing refuses to start.
    #
    # On 2026-07-13 this host rebooted and Docker started PostgreSQL
    # eight seconds later, before /lustre9 was mounted. It got an empty
    # local directory, initdb'd into it, and served an empty database
    # for three weeks. The data was intact the whole time, one
    # directory away. Not starting is a few minutes; starting on the
    # wrong disk is however long it takes somebody to notice.
    #
    # /etc/fstab carries `noauto` for /lustre9/open, so nothing orders
    # against it — the ordering fix belongs in a docker.service drop-in
    # (`RequiresMountsFor=/lustre9/open`) and needs root. This is what
    # can be done from here, and it is worth having either way.
    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-production/storage,target=/rails/storage
        - type=bind,source=/mnt/submission,target=/submission
        - type=bind,source=/lustre9/open/home/ddbjshare,target=/ddbjshare,readonly

proxy:
  host: repository.ddbj.nig.ac.jp

accessories:
  postgres:
    host: repository-production

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-production/postgres,target=/var/lib/postgresql

  seaweedfs:
    host: repository-production

    proxy:
      host: repository-storage.ddbj.nig.ac.jp

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-production/seaweedfs,target=/data
