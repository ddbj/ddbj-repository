service: repository
image: w3const/repository
require_destination: true

# How long a new container has to become healthy. It migrates before it
# serves (bin/docker-entrypoint), and a migration that rewrites a large
# table outlasts Kamal's 30 seconds: renaming the publication dates took 48
# on dev's two million samples, and the container was stopped half-way.
deploy_timeout: 120

proxy:
  response_timeout: 600

# The jobs run in their own container, on the same host as the web for now
# (each destination's `job` role). Puma's plugin ran them in a forked
# process already, so sharing the host's CPU and memory is unchanged; what
# a container of their own gives is that a job process dying no longer
# stops Puma with it (the plugin did), that the two restart apart, and
# that some jobs taking hours — converting a DRA submission's reads, a
# 100,000-sample TSV import — can be given limits of their own, or moved
# to another host.
#
# Moving is more than changing the role's hosts: Kamal's network does not
# span hosts, and the postgres accessory publishes no port — the jobs
# reach it over the `kamal` network of the host it runs on. Another host
# needs the accessory's port published (and closed to all but that host)
# and the job role pointed at it. SeaweedFS is reached by its public URL
# and Lustre is mounted at the same paths everywhere, so those follow as
# they are.
servers:
  web:
    options:
      group-add: 60000

    env:
      clear:
        WEB_CONCURRENCY: auto

  job:
    cmd: bin/jobs

    # Time to stop in: Solid Queue lets its jobs finish, or checkpoint, for
    # `shutdown_timeout` (config/application.rb) before it kills them, and
    # must be given longer than that here.
    stop_timeout: 60

    options:
      group-add: 60000

    env:
      clear:
        JOB_CONCURRENCY: 4

registry:
  username: w3const

  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    TZ: Asia/Tokyo

  secret:
    - RAILS_MASTER_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  jobs-logs: app logs -r job -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

asset_path: /rails/public/web/assets

builder:
  arch: amd64

  args:
    APP_GID: 11370
    APP_UID: 2233

ssh:
  user: w3const

accessories:
  postgres:
    image: postgres:18.1

    env:
      secret:
        - POSTGRES_PASSWORD

      clear:
        TZ: Asia/Tokyo

  seaweedfs:
    # Pinned, and the same tag as CI's. Left unpinned, each environment ran
    # whatever was newest the last time its accessory happened to boot — for
    # a credential rotation as often as for an upgrade. On 2026-09-17 that
    # was production 4.40, dev 4.34 and staging 4.16: the environment meant to
    # show what production will do was the oldest of the three.
    image: chrislusf/seaweedfs:4.47

    cmd: /entrypoint.sh

    proxy:
      app_port: 8333
      response_timeout: 600

      # Responses straight through. With buffering on — Kamal's default — the
      # proxy writes a whole object to its own disk before it sends the first
      # header, so a download of tens of GB waits that long for its first byte
      # and takes that much of the proxy host's disk, and a client's read
      # timeout runs out first. Requests stay buffered, as before.
      buffering:
        responses: false

      healthcheck:
        interval: 3
        path: /status

    options:
      user: 2233:11370

      # How long `docker container stop` — which is all `kamal accessory stop`
      # and `reboot` run, with no timeout of their own — waits before it
      # SIGKILLs. Docker's default is 10 s, and SeaweedFS takes about 21 to stop
      # cleanly: the volume server stops heartbeating and then deliberately
      # waits 10 s before closing. Until the entrypoint forwarded the signal
      # the server was never asked to stop, and was SIGKILLed while running;
      # with it but without this, it would be SIGKILLed halfway through.
      stop-timeout: 60

    # Only what is the same in every environment. A file lands in the deploy
    # user's home under a path without the destination in it, and the three
    # hosts share that home, so these are one copy for all of them. The keys
    # come from the secrets below, which are kept per destination.
    files:
      - docker/seaweedfs/entrypoint.sh:/entrypoint.sh
      - docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json

    env:
      secret:
        - SEAWEEDFS_ACCESS_KEY
        - SEAWEEDFS_SECRET_KEY

      clear:
        TZ: Asia/Tokyo
