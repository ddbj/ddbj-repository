service: repository
image: w3const/repository
require_destination: true

proxy:
  response_timeout: 600

servers:
  web:
    options:
      group-add: 60000

registry:
  username: w3const

  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    JOB_CONCURRENCY:     4
    SOLID_QUEUE_IN_PUMA: true
    TZ:                  Asia/Tokyo
    WEB_CONCURRENCY:     auto

  secret:
    - RAILS_MASTER_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

asset_path: /rails/public/web/assets

builder:
  arch: amd64

  args:
    APP_GID: 11370
    APP_UID: 2233

ssh:
  user: w3const

accessories:
  postgres:
    image: postgres:18.1

    env:
      secret:
        - POSTGRES_PASSWORD

      clear:
        TZ: Asia/Tokyo

  seaweedfs:
    # Pinned, and the same tag as CI's. Left unpinned, each environment ran
    # whatever was newest the last time its accessory happened to boot — for
    # a credential rotation as often as for an upgrade. On 2026-09-17 that
    # was production 4.40, dev 4.34 and staging 4.16: the environment meant to
    # show what production will do was the oldest of the three.
    image: chrislusf/seaweedfs:4.47

    cmd: /entrypoint.sh

    proxy:
      app_port: 8333
      response_timeout: 600

      # Responses straight through. With buffering on — Kamal's default — the
      # proxy writes a whole object to its own disk before it sends the first
      # header, so a download of tens of GB waits that long for its first byte
      # and takes that much of the proxy host's disk, and a client's read
      # timeout runs out first. Requests stay buffered, as before.
      buffering:
        responses: false

      healthcheck:
        interval: 3
        path: /status

    options:
      user: 2233:11370

      # How long `docker container stop` — which is all `kamal accessory stop`
      # and `reboot` run, with no timeout of their own — waits before it
      # SIGKILLs. Docker's default is 10 s, and SeaweedFS takes about 21 to stop
      # cleanly: the volume server stops heartbeating and then deliberately
      # waits 10 s before closing. Until the entrypoint forwarded the signal
      # the server was never asked to stop, and was SIGKILLed while running;
      # with it but without this, it would be SIGKILLed halfway through.
      stop-timeout: 60

    # Only what is the same in every environment. A file lands in the deploy
    # user's home under a path without the destination in it, and the three
    # hosts share that home, so these are one copy for all of them. The keys
    # come from the secrets below, which are kept per destination.
    files:
      - docker/seaweedfs/entrypoint.sh:/entrypoint.sh
      - docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json

    env:
      secret:
        - SEAWEEDFS_ACCESS_KEY
        - SEAWEEDFS_SECRET_KEY

      clear:
        TZ: Asia/Tokyo
