service: repository
image: w3const/repository
require_destination: true

proxy:
  response_timeout: 600

servers:
  web:
    options:
      group-add: 60000

registry:
  username: w3const

  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    JOB_CONCURRENCY:     4
    SOLID_QUEUE_IN_PUMA: true
    TZ:                  Asia/Tokyo
    WEB_CONCURRENCY:     auto

  secret:
    - RAILS_MASTER_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

asset_path: /rails/public/web/assets

builder:
  arch: amd64

  args:
    APP_GID: 11370
    APP_UID: 2233

ssh:
  user: w3const

accessories:
  postgres:
    image: postgres:18.1

    env:
      secret:
        - POSTGRES_PASSWORD

      clear:
        TZ: Asia/Tokyo

  seaweedfs:
    image: chrislusf/seaweedfs

    cmd: /entrypoint.sh

    proxy:
      app_port: 8333
      response_timeout: 600

      healthcheck:
        interval: 3
        path: /status

    options:
      user: 2233:11370

    files:
      - docker/seaweedfs/entrypoint.sh:/entrypoint.sh
      - docker/seaweedfs/s3.production.json.erb:/etc/seaweedfs/s3.json

    env:
      secret:
        - SEAWEEDFS_ACCESS_KEY
        - SEAWEEDFS_SECRET_KEY

      clear:
        TZ: Asia/Tokyo
