servers:
  web:
    hosts:
      - repository-staging

    # See config/deploy.production.yml for why every Lustre-backed path
    # is a `--mount` and not a `--volume`.
    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-staging/storage,target=/rails/storage
        - type=bind,source=/mnt/submission,target=/submission
        - type=bind,source=/lustre9/open/home/ddbjshare,target=/ddbjshare,readonly

proxy:
  host: repository-staging.ddbj.nig.ac.jp

env:
  clear:
    RAILS_ENV: staging

accessories:
  postgres:
    host: repository-staging

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-staging/postgres,target=/var/lib/postgresql

  seaweedfs:
    host: repository-staging

    proxy:
      host: repository-storage-staging.ddbj.nig.ac.jp

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-staging/seaweedfs,target=/data
