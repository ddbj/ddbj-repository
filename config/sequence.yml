shared:
  jpo_na:
    - prefix: QP
      digits: 6
    - prefix: QQ
      digits: 6
    - prefix: QS
      digits: 6
    - prefix: QT
      digits: 6
    - prefix: QU
      digits: 6
    - prefix: QW
      digits: 6
    - prefix: QX
      digits: 6
    - prefix: RB
      digits: 6
    - prefix: RC
      digits: 6
    - prefix: RD
      digits: 6

  jpo_aa:
    <% ('ZAA'..'ZZZ').each do |prefix| %>
    - prefix: <%= prefix %>
      digits: 7
    <% end %>

  bp:
    - prefix: PRJDB
      digits: 9
      pad:    false

  bs:
    - prefix: SAMD
      digits: 8

  # DRA's numbers, as D-way writes them: at least six digits, more once six
  # run out (DRR1000000) — so the capacity is `digits`, and `pad` the width
  # a smaller one is padded to. D-way issues them by kind from one counter
  # each (`max(acc_no) + 1`), and so do these; `next` starts where D-way's
  # stopped, set when DRA is taken over from it.
  dra:
    - prefix: DRA
      digits: 9
      pad:    6

  drx:
    - prefix: DRX
      digits: 9
      pad:    6

  drr:
    - prefix: DRR
      digits: 9
      pad:    6

  drz:
    - prefix: DRZ
      digits: 9
      pad:    6
