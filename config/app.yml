development:
  app_url:                <%= ENV.fetch('APP_URL', 'http://localhost:3000') %>
  mass_dir_path_template: <%= Rails.root.join('storage/mass/{user}') %>
  repository_dir:         <%= Rails.root.join('storage/repository') %>
  validator_url:          http://localhost:3001/api
  account_url:            https://cloakman.localhost
  web_url:                <%= ENV.fetch('WEB_URL', 'http://localhost:4200') %>

  # Base directory for generated release artifacts. Subdirectories are
  # created underneath: public/ (public XML dumps), exchange/ (three-pole
  # exchange XML), collab/ (BP/BS livelists).
  output_dir: <%= Rails.root.join('storage/output') %>

  # Reading BioProject / BioSample out of the D-way Postgres. Only where
  # the migration is actually being worked on: the credentials for it are
  # present wherever the app is deployed, so without this the difference
  # between "we import here" and "we do not" is that nobody has pressed
  # the button yet.
  data_migration: true

test:
  app_url:                http://repository.example.com:3000
  mass_dir_path_template: <%= Rails.root.join('spec/fixtures/files/submission/{user}') %>
  repository_dir:         <%= Rails.root.join('tmp/storage/repository') %>
  validator_url:          http://validator.example.com/api
  account_url:            https://accounts.example.com/
  web_url:                http://repository.example.com:4200

  output_dir:     <%= Rails.root.join('tmp/storage/output') %>
  data_migration: true

production: &production
  app_url:                https://repository.ddbj.nig.ac.jp
  mass_dir_path_template: /submission/{user}/submission/{user}/mass

  # Nothing leaves DDBJ yet. Every deployed environment now carries this,
  # production included: the curator screens can issue accessions and
  # answer messages, and both mail the submitter, so until that is
  # deliberately switched on the safe default is that only we receive it.
  #
  # Removing this line is what turns real mail on. The admin nav says so
  # on every screen while it is here — a restriction nobody can see is
  # one that gets discovered by a submitter who never replied.
  mail_allowed_domains:   [ddbj.nig.ac.jp, ursm.jp]
  repository_dir:         <%= Rails.root.join('storage/repository') %>
  sentry_dsn:             https://7060cd8e48b01bfc7c294852533bdc83@o4506770361024512.ingest.sentry.io/4506778643333120
  validator_url:          http://repository-validator:3000/api
  account_url:            https://accounts.ddbj.nig.ac.jp/
  web_url:                https://repository.ddbj.nig.ac.jp

  output_dir: <%= Rails.root.join('storage/output') %>

staging:
  <<: *production
  app_url:              https://repository-staging.ddbj.nig.ac.jp
  web_url:              https://repository-staging.ddbj.nig.ac.jp
  account_url:          https://accounts-staging.ddbj.nig.ac.jp/

dev:
  <<: *production
  app_url:              https://repository-dev.ddbj.nig.ac.jp
  web_url:              https://repository-dev.ddbj.nig.ac.jp
  account_url:          https://accounts-staging.ddbj.nig.ac.jp/

  # Where the BP/BS migration is worked on. staging and production
  # inherit the production block, which does not carry this.
  data_migration:       true
