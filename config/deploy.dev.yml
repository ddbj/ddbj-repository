servers:
  web:
    hosts:
      - repository-dev

    # See config/deploy.production.yml for why every Lustre-backed path
    # is a `--mount` and not a `--volume`.
    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-dev/storage,target=/rails/storage
        - type=bind,source=/mnt/submission,target=/submission
        - type=bind,source=/lustre9/open/home/ddbjshare,target=/ddbjshare,readonly

proxy:
  host: repository-dev.ddbj.nig.ac.jp

env:
  clear:
    RAILS_ENV: dev

accessories:
  postgres:
    host: repository-dev

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-dev/postgres,target=/var/lib/postgresql

  seaweedfs:
    host: repository-dev

    proxy:
      host: repository-storage-dev.ddbj.nig.ac.jp

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-dev/seaweedfs,target=/data

  virtuoso:
    host: repository-dev

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-dev/virtuoso,target=/database

  validator:
    host: repository-dev

    env:
      clear:
        DDBJ_VALIDATOR_APP_POSTGRES_HOST: a012

    options:
      mount:
        - type=bind,source=/home/w3const/volumes/repository-dev/validator/conf/pub,target=/usr/src/ddbj_validator/conf/pub
        - type=bind,source=/home/w3const/volumes/repository-dev/validator/conf/coll_dump,target=/usr/src/ddbj_validator/conf/coll_dump
        - type=bind,source=/home/w3const/volumes/repository-dev/validator/logs,target=/usr/src/ddbj_validator/logs
