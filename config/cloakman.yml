development:
  # Served by Caddy over a UNIX socket, so there is no port to collide
  # with — the old default shared 3001 with the validator.
  url:       <%= ENV.fetch('CLOAKMAN_URL', 'https://cloakman.localhost') %>
  api_token: <%= ENV['CLOAKMAN_API_TOKEN'] %>

test:
  url:       http://cloakman.example.com
  api_token: notasecret

production:
  url:       https://accounts.ddbj.nig.ac.jp
  api_token: <%= Rails.application.credentials.dig(:cloakman, :api_token) %>

staging:
  url:       https://accounts-staging.ddbj.nig.ac.jp
  api_token: <%= Rails.application.credentials.dig(:cloakman, :api_token) %>

dev:
  url:       https://accounts-staging.ddbj.nig.ac.jp
  api_token: <%= Rails.application.credentials.dig(:cloakman, :api_token) %>
