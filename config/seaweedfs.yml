development:
  endpoint:   http://localhost:8333
  bucket:     repository
  access_key: <%= ENV['SEAWEEDFS_ACCESS_KEY'] %>
  secret_key: <%= ENV['SEAWEEDFS_SECRET_KEY'] %>

# A bucket of its own and an identity that reaches only it. The suite writes
# and deletes freely, so the same keys as development would be one wrong
# bucket name away from the development data; with these, that mistake is a
# 403. CI runs an instance with no identities, where any keys will do.
test:
  endpoint:   <%= ENV.fetch('SEAWEEDFS_TEST_ENDPOINT', 'http://localhost:8333') %>
  bucket:     repository-test
  access_key: <%= ENV['SEAWEEDFS_TEST_ACCESS_KEY'] %>
  secret_key: <%= ENV['SEAWEEDFS_TEST_SECRET_KEY'] %>

production: &production
  endpoint:   https://repository-storage.ddbj.nig.ac.jp
  bucket:     uploads
  access_key: <%= Rails.application.credentials.dig(:seaweedfs, :access_key) %>
  secret_key: <%= Rails.application.credentials.dig(:seaweedfs, :secret_key) %>

staging:
  <<: *production
  endpoint: https://repository-storage-staging.ddbj.nig.ac.jp

dev:
  <<: *production
  endpoint: https://repository-storage-dev.ddbj.nig.ac.jp
