# DDBJ Record Canonical JSON v3 — array mode + string class + volatile path registry.
#
# Derived from ddbj-record-specifications @ 47cd4433 (2026-09-26) and
# doc/canonical-json.md §3 / §4 / §6.
#
# DO NOT modify after first use. Changes require a canonical_version bump
# and a plan for records written under the previous version.
#
# For the v1 → v2 bump that plan is a full re-import rather than a
# reconciling migration: replay is pure RFC 6902 so v1 chains still
# materialise correctly, and the migrated corpus is rebuilt from D-way.
#
# A v1 chain must NOT be extended with a v2 patch, though: v1 stored root
# snapshots in raw converter order while v2 diffs index into canonical
# order, so a positional op would name the wrong element of a keyed array.
# Submission#append_update! detects this (`submissions.canonical_version`
# below the current one) and replaces the whole record instead of diffing,
# healing the chain in one step. Re-import is still the cheaper route for
# the migrated corpus; the heal is what keeps an untouched record from
# being corrupted by a curator edit in the meantime.
#
# The v2 → v3 bump follows the spec's v3 changing shape within v3
# (ddbj/ddbj-record-specifications#11): `project` became `projects`, so every
# path under it moved. Records written under v2 are rewritten in place into
# the new shape by `rake ddbj_record:reshape_v3`, whose one root replace per
# chain is also the heal above — a re-import would rebuild them from D-way
# and revert every edit made in the repository.
#
# Three entries under `/sequences` were corrected without a bump. A source
# feature's qualifiers live at `source_features/*/source/qualifiers/*`, not
# `source_features/*/qualifiers/*`, and the shared source's at
# `common_source/qualifiers/*` was missing, so the ordered mode §3.1 gives
# every INSDC qualifier list never applied to either and they fell to the
# default bag. `structured_comments` is `/sequences/structured_comments`, not
# a field of each entry. No v3 record written so far has `sequences` —
# BP/BS carry none and ApplySubmissionRequestJob refuses v3 — so none of
# this changes the canonical bytes of anything stored, which is what §3.4
# asks of a path added without one.
#
# Later within v3, again without a bump (§3.4, doc version history): every list
# of the schema is registered, and the lists of objects are keyed on alias
# with equal aliases in written order (`ties: written`), so a relation's
# `index` — a position among one kind's objects sharing an alias — survives
# canonicalisation. Of those lists only /samples is stored, and its bytes move
# only where two samples of one record share an alias.
canonical_version: ddbj-canon/v3

# ----------------------------------------------------------------------
# Arrays: ordered (preserve input order) / keyed (sort by tuple) / bag
# (sort by sha256 of canonical bytes).
# ----------------------------------------------------------------------
arrays:
  # ----- ordered -----
  '/submission/submitters':                                                   {mode: ordered}
  # v3 Submission.comments is `list[str]` — curator notes accumulate in
  # input order and reading them sorted destroys narrative continuity
  # ("first I noted X, then Y"). Omitted from the original registry
  # because at canonical_version bump time no record had multi-element
  # comments (2677 BS records had exactly one-element arrays from the
  # Converter's `Array(comment.presence)` wrap, which bag-mode sorts to
  # themselves — verified 2026-06-04). Adding the path here is a
  # registry-omission fix; canonical bytes for every existing record
  # are byte-identical because single-element arrays are sort-invariant.
  '/submission/comments':                                                     {mode: ordered}
  '/sequences/entries':                                                       {mode: ordered}
  '/sequences/entries/*/source_features':                                     {mode: ordered}
  '/sequences/entries/*/source_features/*/source/qualifiers/*':               {mode: ordered}
  '/sequences/common_source/qualifiers/*':                                    {mode: ordered}
  '/sequences/entries/*/comments':                                            {mode: ordered}
  '/experiments/*/spot_descriptor/reads':                                     {mode: ordered}
  '/experiments/*/processing':                                                {mode: ordered}
  '/analyses/*/processing':                                                   {mode: ordered}
  '/runs/*/data_blocks':                                                      {mode: ordered}
  '/runs/*/data_blocks/*/files':                                              {mode: ordered}
  '/analyses/*/data_blocks':                                                  {mode: ordered}
  '/analyses/*/data_blocks/*/files':                                          {mode: ordered}
  # A BioProject's record has one project; an SRA submission may hold
  # several studies, written in an order the spec keeps.
  '/projects':                                                                {mode: ordered}
  '/projects/*/publications/*/authors':                                       {mode: ordered}
  '/projects/*/publications/*/consortiums':                                   {mode: ordered}
  # Two titles in one language occur (ST.26), so the language cannot key them.
  '/submission/st26/invention_titles':                                        {mode: ordered}
  '/features/*/qualifiers/*':                                                 {mode: ordered}
  # Every other list of the schema (canonical-json.md §3.1, ordered).
  # None is in a BP / BS record, so adding them changed nothing stored (§3.4).
  # Written order is what the spec keeps on a round trip, and the lists are
  # small, so ordering them costs a diff nothing.
  '/access_control/dac/contacts/*/organizations':                             {mode: ordered}
  '/analyses/*/comments':                                                     {mode: ordered}
  '/analyses/*/data_blocks/*/files/*/legacy/data_series_labels':              {mode: ordered}
  '/analyses/*/data_blocks/*/files/*/read_labels':                            {mode: ordered}
  '/analyses/*/identifiers':                                                  {mode: ordered}
  '/analyses/*/processing/*/prev_step_indexes':                               {mode: ordered}
  '/analyses/*/protocol_refs':                                                {mode: ordered}
  '/analyses/*/reference_alignment/custom_assembly/sources':                  {mode: ordered}
  '/analyses/*/reference_alignment/run_labels':                               {mode: ordered}
  '/analyses/*/reference_alignment/run_labels/*/run/identifiers':             {mode: ordered}
  '/analyses/*/reference_alignment/seq_labels':                               {mode: ordered}
  '/analyses/*/reference_alignment/standard_assembly/names':                  {mode: ordered}
  '/array_design/file/legacy/data_series_labels':                             {mode: ordered}
  '/array_design/file/read_labels':                                           {mode: ordered}
  '/array_design/term_sources':                                               {mode: ordered}
  '/experiments/*/comments':                                                  {mode: ordered}
  '/experiments/*/identifiers':                                               {mode: ordered}
  '/experiments/*/legacy/gaps':                                               {mode: ordered}
  '/experiments/*/legacy/quality_scoring':                                    {mode: ordered}
  '/experiments/*/platform/array_design/identifiers':                         {mode: ordered}
  '/experiments/*/platform/legacy/color_matrix':                              {mode: ordered}
  '/experiments/*/pool/default_member/extract/comments':                      {mode: ordered}
  '/experiments/*/pool/default_member/extract/protocol_refs':                 {mode: ordered}
  '/experiments/*/pool/default_member/factor_values':                         {mode: ordered}
  '/experiments/*/pool/default_member/protocol_refs':                         {mode: ordered}
  '/experiments/*/pool/default_member/read_labels':                           {mode: ordered}
  '/experiments/*/pool/default_member/sample/identifiers':                    {mode: ordered}
  '/experiments/*/pool/members':                                              {mode: ordered}
  '/experiments/*/pool/members/*/extract/comments':                           {mode: ordered}
  '/experiments/*/pool/members/*/extract/protocol_refs':                      {mode: ordered}
  '/experiments/*/pool/members/*/factor_values':                              {mode: ordered}
  '/experiments/*/pool/members/*/protocol_refs':                              {mode: ordered}
  '/experiments/*/pool/members/*/read_labels':                                {mode: ordered}
  '/experiments/*/pool/members/*/sample/identifiers':                         {mode: ordered}
  '/experiments/*/processing/*/prev_step_indexes':                            {mode: ordered}
  '/experiments/*/protocol_refs':                                             {mode: ordered}
  '/experiments/*/spot_descriptor/reads/*/expected_basecall_table/basecalls': {mode: ordered}
  '/projects/*/experimental_factors':                                         {mode: ordered}
  '/projects/*/identifiers':                                                  {mode: ordered}
  '/projects/*/protocols':                                                    {mode: ordered}
  '/projects/*/publications/*/authors/*/organizations':                       {mode: ordered}
  '/relations/*/target/identifiers':                                          {mode: ordered}
  '/runs/*/comments':                                                         {mode: ordered}
  '/runs/*/data_blocks/*/files/*/legacy/data_series_labels':                  {mode: ordered}
  '/runs/*/data_blocks/*/files/*/read_labels':                                {mode: ordered}
  '/runs/*/identifiers':                                                      {mode: ordered}
  '/runs/*/platform/array_design/identifiers':                                {mode: ordered}
  '/runs/*/platform/legacy/color_matrix':                                     {mode: ordered}
  '/runs/*/processing':                                                       {mode: ordered}
  '/runs/*/processing/*/prev_step_indexes':                                   {mode: ordered}
  '/runs/*/protocol_refs':                                                    {mode: ordered}
  '/runs/*/spot_descriptor/reads':                                            {mode: ordered}
  '/runs/*/spot_descriptor/reads/*/expected_basecall_table/basecalls':        {mode: ordered}
  '/samples/*/comments':                                                      {mode: ordered}
  '/samples/*/identifiers':                                                   {mode: ordered}
  '/sequences/entries/*/source_features/*/definition':                        {mode: ordered}
  '/submission/gea/legacy/cibex/array_designs':                               {mode: ordered}
  '/submission/gea/legacy/cibex/array_designs/*/data_fields':                 {mode: ordered}
  '/submission/gea/legacy/cibex/hybridizations':                              {mode: ordered}
  '/submission/gea/legacy/cibex/hybridizations/*/data_fields':                {mode: ordered}
  '/submission/gea/legacy/cibex/labeled_extracts':                            {mode: ordered}
  '/submission/gea/legacy/cibex/protocols':                                   {mode: ordered}
  '/submission/gea/legacy/cibex/references':                                  {mode: ordered}
  '/submission/gea/legacy/cibex/samples':                                     {mode: ordered}
  '/submission/gea/legacy/cibex/submitters':                                  {mode: ordered}
  '/submission/gea/legacy/cibex/summaries':                                   {mode: ordered}
  '/submission/gea/legacy/cibex/summaries/*/data_fields':                     {mode: ordered}
  '/submission/identifiers':                                                  {mode: ordered}
  '/submission/sra/actions':                                                  {mode: ordered}
  '/submission/sra/contacts':                                                 {mode: ordered}
  '/submission/sra/legacy/files':                                             {mode: ordered}
  '/submission/sra/legacy/files/*/legacy/data_series_labels':                 {mode: ordered}
  '/submission/sra/legacy/files/*/read_labels':                               {mode: ordered}
  '/provenance/gff/pragmas':                                                  {mode: ordered}

  # ----- keyed -----
  # The lists of objects: keyed on alias, equal aliases in the order written, so a
  # relation's `index` (its position among one kind's objects sharing an alias) keeps
  # pointing at the same one. Nothing but /samples is stored yet (§3.4).
  '/samples':                                                                 {mode: keyed, key: [alias], ties: written}
  '/relations':                                                               {mode: keyed, key: [type, label, source/type, source/accession, source/alias, source/index, target/db, target/id, target/accession, target/index, target/url]}
  '/projects/*/publications':                                                 {mode: keyed, key: [doi, pubmed_id, title]}
  '/projects/*/grants':                                                       {mode: keyed, key: [id, title, agency]}
  '/datasets':                                                                {mode: keyed, key: [alias], ties: written}
  '/experiments':                                                             {mode: keyed, key: [alias], ties: written}
  '/runs':                                                                    {mode: keyed, key: [alias], ties: written}
  '/analyses':                                                                {mode: keyed, key: [alias], ties: written}
  '/features':                                                                {mode: keyed, key: [alias], ties: written}
  '/access_control/dac/contacts':                                             {mode: keyed, key: [email, last_name, first_name]}
  '/submission/attributes':                                                   {mode: keyed, key: [name, unit]}
  '/assembly/attributes':                                                     {mode: keyed, key: [name, unit]}
  '/datasets/*/attributes':                                                   {mode: keyed, key: [name, unit]}
  # Fallback: any other path ending in /attributes (samples, project, run,
  # analysis, experiment, sequences, etc.) keys by (name, unit).
  '/**/attributes':                                                           {mode: keyed, key: [name, unit]}

  # ----- bag -----
  '/features/*/parent_ids':                                                   {mode: bag}
  '/sequences/structured_comments':                                           {mode: bag}
  '/submission/submitters/*/organizations':                                   {mode: bag}
  '/datasets/*/dataset_types':                                                {mode: bag}
  '/projects/*/keywords':                                                     {mode: bag}
  '/projects/*/study_types':                                                  {mode: bag}
  '/projects/*/locus_tag_prefix':                                             {mode: bag}
  '/projects/*/target/data_types':                                            {mode: bag}
  '/experiments/*/targeted_loci':                                             {mode: bag}

# ----------------------------------------------------------------------
# Volatile sub-trees stripped before diff (for_diff: true).
#
# Membership rule (canonical-json.md §4.1): would regenerating this record
# from the same source produce a different value? Authorship is NOT the
# test — `accession` is archive-assigned but stable, so it stays in the
# diff and issuance shows up as a patch (v2; stripped in v1).
# ----------------------------------------------------------------------
volatile_paths:
  - '/provenance'           # whole sub-tree
  - '/schema_version'
  - '/**/last_update'
  - '/**/access'
  - '/**/publication_date'

# ----------------------------------------------------------------------
# String classification. Default = multi_line (preserve newlines, trim
# horizontal whitespace per line). single_line collapses internal whitespace
# to a single ASCII space. sequence is a streaming-compatible class for
# nucleotide sequences (no NFC, no collapse, alphabet-restricted).
# ----------------------------------------------------------------------
strings:
  default: multi_line
  paths:
    '/sequences/entries/*/sequence':                      sequence
    '/submission/hold_date':                              single_line
    '/submission/st26/application/filing_date':           single_line
    '/submission/st26/earliest_priority/filing_date':     single_line
    '/submission/st26/production_date':                   single_line
    '/**/orcid':                                          single_line
    '/**/doi':                                            single_line
    '/**/pubmed_id':                                      single_line
    '/**/checksum':                                       single_line
    '/**/email':                                          single_line
    '/**/url':                                            single_line
    '/**/ror_id':                                         single_line
    '/**/language_code':                                  single_line
    '/relations/*/properties/*':                          single_line
    '/projects/*/relevance/*':                            single_line
    # Kept as written ("009606", "not applicable"); an identifier, not prose.
    '/**/taxonomy_id':                                    single_line
    '/access_control/policy/policy_url':                  single_line

# ----------------------------------------------------------------------
# JSON number paths that are allowed to carry a Float per canonical-json.md
# §2.3. Defaults to NONE — every other numeric path must be an Integer in
# IEEE-754 safe range or a String (identifier-like).
# ----------------------------------------------------------------------
floats:
  - '/experiments/*/library/nominal_sdev'
  - '/experiments/*/pool/default_member/proportion'
  - '/experiments/*/pool/members/*/proportion'
  - '/experiments/*/legacy/gaps/*/mean'
  - '/experiments/*/legacy/gaps/*/stdev'
  - '/experiments/*/legacy/quality_scoring/*/multiplier'
  - '/features/*/score'

