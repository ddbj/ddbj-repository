            authorisation happened here, on this request.

        '404':
          $ref: '#/components/responses/NotFound'

  /direct_uploads:
    post:
      description: |
        Reserve a place in storage and get a URL to PUT the bytes to. The
        request and response shapes are Active Storage's contract with
        `@rails/activestorage` in the browser, not this application's, so they
        are not pinned here.

        Authenticated, unlike Active Storage's own endpoint: it mints a row and
        a presigned PUT to whoever asks, which is defensible as a framework
        route and not as one we redraw.

      tags:
        - Uploads

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

      responses:
        '200':
          description: The blob, including `signed_id` and where to PUT the bytes.

          content:
            application/json:
              schema:
                type: object

        '401':
          $ref: '#/components/responses/Unauthorized'

  /stats:
    get:
      description: |
        How much of each accession space has been handed out, and the state
        of the loaded taxonomy. No authentication: these are counts, not
        anybody's data.

      tags:
        - Stats

      security: []

      responses:
        '200':
          description: Returns the sequence and taxdump counters.

          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sequences, taxdump]

                properties:
                  sequences:
                    type: array

                    items:
                      type: object
                      additionalProperties: false
                      required: [scope, next, total, used, remaining]

                      properties:
                        # Deliberately not an enum. The set of spaces grows
                        # as databases are migrated in, and a client that
                        # rejects an unfamiliar scope would break on the
                        # release that adds one rather than ignore it.
                        scope:
                          type: string

                        next:
                          description: |
                            The number the next allocation will hand out.
                            `null` once every prefix in the space is used
                            up, which is also when `remaining` reaches 0.
                          type:
                            - string
                            - 'null'

                        total:
                          type: number

                        used:
                          type: number

                        remaining:
                          type: number

                  taxdump:
                    type: object
                    additionalProperties: false
                    required: [names_count, nodes_count, loaded_at]

                    properties:
                      names_count:
                        type: number

                      nodes_count:
                        type: number

                      loaded_at:
                        description: '`null` before the first load.'

                        type:
                          - string
                          - 'null'

                        format: date-time

components:
  schemas:
    Db:
      type: string

      enum:
        - st26
        - bioproject
        - biosample

    SubmissionRequestSummary:
      type: object
      additionalProperties: false

      required:
        - id
        - db
        - status
        - created_at
        - closed_at
        - submission_id
        - source_id
        - first_accession
        - accession_count
        - processing
        - unread_curator_message_count
        - progress

      properties:
        id:
          type: number

        db:
          $ref: '#/components/schemas/Db'

        status:
          $ref: '#/components/schemas/SubmissionOperationStatus'

        created_at:
          type: string
          format: date-time

        closed_at:
          description: |
            The submitter put this request down. A row and the page it opens
            answer the same question from the same facts, so the summary
            carries it too.
          type:
            - string
            - 'null'
          format: date-time

        submission_id:
          # `type: [number, 'null']`, not OpenAPI 3.0's `nullable: true` —
          # this document is 3.1, where `nullable` is not a keyword at all
          # and was silently declaring the field non-null. Every request
          # that has not been applied yet sends null here.
          type:
            - number
            - 'null'

        source_id:
          type:
            - string
            - 'null'

        first_accession:
          type:
            - string
            - 'null'

        accession_count:
          type: number

        processing:
          description: Validation or application is running right now.
          type: boolean

        unread_curator_message_count:
          type: number

        progress:
          $ref: '#/components/schemas/Progress'

    SetSummary:
      type: object
      additionalProperties: false

      required:
        - id
        - name
        - owner_uid
        - owned
        - created_at
        - member_count
        - invited_count
        - submission_count

      properties:
        id:
          type: number

        name:
          type: string

        owner_uid:
          type: string

        owned:
          description: You created it, so renaming and deleting it are yours.
          type: boolean

        created_at:
          type: string
          format: date-time

        member_count:
          description: People who have accepted.
          type: number

        invited_count:
          description: Invitations still outstanding.
          type: number

        submission_count:
          type: number

    Set:
      type: object
      additionalProperties: false

      required:
        - id
        - name
        - owner_uid
        - owned
        - created_at
        - member_count
        - invited_count
        - submission_count
        - deletable
        - delete_blocked_reason
        - members
        - submissions

      properties:
        id:
          type: number

        name:
          type: string

        owner_uid:
          type: string

        owned:
          type: boolean

        created_at:
          type: string
          format: date-time

        member_count:
          type: number

        invited_count:
          type: number

        submission_count:
          type: number

        deletable:
          description: |
            Whether the set can be deleted now — only once everyone else has
            left and every submission has been taken out. Deleting is the
            owner's; this says nothing about who you are.
          type: boolean

        delete_blocked_reason:
          description: |
            Why it cannot be, in words. Null when it can. Served rather than
            re-worded by the client, so the rule and its wording stay together.
          type:
            - string
            - 'null'

        members:
          type: array

          items:
            $ref: '#/components/schemas/SetMember'

        submissions:
          type: array

          items:
            $ref: '#/components/schemas/SetSubmission'

    SetMember:
      type: object
      additionalProperties: false

      required:
        - id
        - email
        - uid
        - status
        - owner
        - you
        - invited_by
        - joined_at
        - invitation_expires_at
        - removable
        - submission_count
        - invited_address_match
        - invitation_url
        - mail_deliverable

      properties:
        id:
          type: number

        email:
          description: The address the invitation was sent to. Null on the creator's own row, who was never invited.
          type:
            - string
            - 'null'

        uid:
          description: The account that accepted. Null while the invitation is still out.
          type:
            - string
            - 'null'

        status:
          description: |
            `accepted` — they are in. `open` — the invitation is out and live.
            `expired` — it lapsed; any member can send it again. The same three
            words the invitation page uses, so the roster and the link cannot
            describe one row differently.
          type: string

          enum:
            - open
            - expired
            - accepted

        owner:
          type: boolean

        you:
          type: boolean

        invited_by:
          type: string

        joined_at:
          type:
            - string
            - 'null'
          format: date-time

        invitation_expires_at:
          type:
            - string
            - 'null'
          format: date-time

        removable:
          description: |
            Whether you may take this row off the roster — by leaving, by
            removing somebody as the owner, or by taking back an invitation you
            sent. Stated by the server because the three are different
            permissions and, under a proxy login, the account the client
            believes it is is not the account the server acts as.
          type: boolean

        submission_count:
          description: |
            How many of this set's submissions are theirs, and would therefore
            be taken out of it with them. Counted over the whole set, not over
            the page of submissions being shown.
          type: number

        invited_address_match:
          description: |
            Whether the account that walked through the invitation is registered
            at the address it was sent to. `unknown` when that account carries
            no address at all — most accounts imported from D-way have never
            signed in. Null where the question does not arise: the creator's own
            row, which was never invited.

            A forwarded invitation is a real thing people do, so this is
            reported rather than refused — it is the whole of the audit that
            pays for not binding the token to the address.
          type:
            - string
            - 'null'

          enum:
            - same
            - different
            - unknown
            - null

        invitation_url:
          description: |
            The link an outstanding invitation was mailed as. Null once it has
            been walked through. Offered to members so they can send it by hand
            when the mail did not arrive — which includes every environment
            where outgoing mail is restricted (see `mail_deliverable`).
          type:
            - string
            - 'null'

        mail_deliverable:
          description: |
            Whether the invitation mail actually leaves the building. False in a
            deployed environment whose outgoing mail is restricted to DDBJ
            addresses, in which case the invitation exists and works but nobody
            was told about it — hand them `invitation_url` instead. Null once
            the invitation has been walked through.
          type:
            - boolean
            - 'null'

    SetSubmission:
      type: object
      additionalProperties: false

      required:
        - added_at
        - owner_uid
        - owned
        - submission

      properties:
        added_at:
          type: string
          format: date-time

        owner_uid:
          description: Whose submission this is. In every other list it goes without saying; here it is the first thing a reader needs.
          type: string

        owned:
          description: |
            It is yours, so taking it out of the set is yours to do. Said by
            the server for the same reason `removable` is on a member.
          type: boolean

        submission:
          $ref: '#/components/schemas/SubmissionRequestSummary'

    Invitation:
      type: object
      additionalProperties: false

      required:
        - set_name
        - invited_by
        - email
        - expires_at
        - status

      properties:
        set_name:
          type: string

        invited_by:
          type: string

        email:
          type: string

        expires_at:
          description: Null once the invitation has been walked through.
          type:
            - string
            - 'null'
          format: date-time

        status:
          description: |
            `open` — ready to be walked through. `expired` — ask a member of the
            set to send it again. `accepted` — somebody has already used this
            link; the token is kept after acceptance precisely so the page can
            say so instead of answering with a 404.
          type: string

          enum:
            - open
            - expired
            - accepted

    ReviewerAccess:
      type: object
      additionalProperties: false

      required:
        - enabled

      properties:
        enabled:
          type: boolean

        url:
          type: string

        expires_at:
          type: string
          format: date-time

    SubmissionRequestStatus:
      type: object
      additionalProperties: false

      required:
        - id
        - status
        - error_code
        - error_message
        - processing

      properties:
        id:
          type: number

        status:
          $ref: '#/components/schemas/SubmissionOperationStatus'

        error_code:
          description: |
            Machine-readable reason the application failed. Null until it does.
            Branch on this rather than on `error_message`, whose wording changes
            without notice. An unknown code means an unexpected internal error;
            treat it like `TRD_R9999`.
          type:
            - string
            - 'null'

        error_message:
          type:
            - string
            - 'null'

        processing:
          type: boolean

    SubmissionRequest:
      type: object
      additionalProperties: false

      required:
        - id
        - db
        - status
        - error_code
        - error_message
        - created_at
        - closed_at
        - closable
        - owned
        - owner_uid
        - processing
        - ddbj_record
        - validation
        - submission
        - progress
        - unread_curator_message_count
        - last_message_at
        - sets

      properties:
        id:
          type: number

        db:
          $ref: '#/components/schemas/Db'

        status:
          $ref: '#/components/schemas/SubmissionOperationStatus'

        error_code:
          description: |
            Machine-readable reason the application failed. Null until it does.
            Branch on this rather than on `error_message`, whose wording changes
            without notice. An unknown code means an unexpected internal error;
            treat it like `TRD_R9999`.
          type:
            - string
            - 'null'

        error_message:
          type:
            - string
            - 'null'

        created_at:
          type: string
          format: date-time

        sets:
          description: |
            The sets this submission has been shared into. Withheld from the
            reviewer view — somebody holding a share link is not party to who
            else is working on this.
          type: array

          items:
            type: object
            additionalProperties: false
            required: [id, name]

            properties:
              id:
                type: number

              name:
                type: string

        closed_at:
          description: |
            When the submitter put this request down. A request that failed
            validation cannot be advanced — a corrected file arrives as a new
            request — so closing is the only way it reaches an end. Null while
            it is still open.
          type:
            - string
            - 'null'
          format: date-time

        closable:
          description: |
            Whether you may close it now. True only while the request is asking
            its owner for something (validation failed, or ready to apply) —
            and never for somebody reading it through a shared set.
          type: boolean

        owned:
          description: |
            You are the submitter. False when you are reading this through a
            set somebody else's submission was shared into, in which case
            nothing on the page is yours to press and the conversation facts
            are withheld.
          type: boolean

        owner_uid:
          description: |
            Whose submission this is. Yours when `owned`; otherwise the
            colleague whose work you are reading through a shared set — the
            page says so rather than addressing you as its submitter.
          type: string

        processing:
          type: boolean

        ddbj_record:
          $ref: '#/components/schemas/Attachment'

        validation:
          anyOf:
            - $ref: '#/components/schemas/Validation'
            - type: 'null'

        submission:
          anyOf:
            - $ref: '#/components/schemas/Submission'
            - type: 'null'

        progress:
          $ref: '#/components/schemas/Progress'

        unread_curator_message_count:
          type: number

        last_message_at:
          description: When the thread was last posted to, by either party.
          type:
            - string
            - 'null'
          format: date-time

    ReviewerSubmissionRequest:
      description: |
        What a share-link holder may see. Identical to SubmissionRequest
        minus the messaging facts: the endpoint is unauthenticated, so it
        must not disclose that a curator ↔ submitter conversation exists.
        Spelled out rather than derived from SubmissionRequest because
        `additionalProperties: false` does not compose through `allOf` —
        which also means a field added to the submitter view stays out of
        this one until somebody decides it belongs here.
      type: object
      additionalProperties: false

      required:
        - id
        - db
        - status
        - error_code
        - error_message
        - created_at
        - closed_at
        - processing
        - ddbj_record
        - validation
        - submission
        - progress

      properties:
        id:
          type: number

        db:
          $ref: '#/components/schemas/Db'

        status:
          $ref: '#/components/schemas/SubmissionOperationStatus'

        error_code:
          description: |
            Machine-readable reason the application failed. Null until it does.
            Branch on this rather than on `error_message`, whose wording changes
            without notice. An unknown code means an unexpected internal error;
            treat it like `TRD_R9999`.
          type:
            - string
            - 'null'

        error_message:
          type:
            - string
            - 'null'

        created_at:
          type: string
          format: date-time

        closed_at:
          description: The submitter put this request down. Null while it is still open.
          type:
            - string
            - 'null'
          format: date-time

        processing:
          type: boolean

        ddbj_record:
          $ref: '#/components/schemas/Attachment'

        validation:
          anyOf:
            - $ref: '#/components/schemas/Validation'
            - type: 'null'

        submission:
          anyOf:
            - $ref: '#/components/schemas/Submission'
            - type: 'null'

        progress:
          $ref: '#/components/schemas/Progress'

    Progress:
      description: |
        How far along the request is, in a vocabulary a submitter can read.
        Derived server-side from the ingest status and the curation rows —
        neither of the underlying enums is a progress scale on its own.
      type: object
      additionalProperties: false

      required:
        - step
        - failed
        - closed
        - row_count
        - accessioned_count
        - hold_date

      properties:
        step:
          type: string
          enum:
            - submitted
            - validated
            - applied
            - curating
            - accession_issued
            - public

        failed:
          description: The pipeline stopped at the step after `step`.
          type: boolean

        closed:
          description: |
            The record left the pipeline — withdrawn, canceled or
            permanently suppressed. `step` is then where it stopped, not
            where work is in progress.
          type: boolean

        row_count:
          description: Curation rows behind the request — 1 project (BP), N samples (BS), 0 otherwise.
          type: number

        accessioned_count:
          type: number

        hold_date:
          description: Scheduled release date. Only BioProject carries one.
          type:
            - string
            - 'null'
          format: date

    Validation:
      type: object
      additionalProperties: false

      required:
        - id
        - progress
        - created_at
        - finished_at
        - validity
        - details

      properties:
        id:
          type: number

        progress:
          type: string

          enum:
            - running
            - finished
            - canceled

        created_at:
          type: string
          format: date-time

        finished_at:
          type:
            - string
            - 'null'

          format: date-time

        validity:
          type:
            - string
            - 'null'

          enum:
            - valid
            - invalid

        details:
          type: array

          items:
            type: object
            additionalProperties: false

            required:
              - entry_id
              - code
              - severity
              - message

            properties:
              entry_id:
                type:
                  - string
                  - 'null'

              code:
                type: string

              severity:
                type: string

                enum:
                  - warning
                  - error

              message:
                type: string

    SubmissionSummary:
      type: object
      additionalProperties: false

      required:
        - id
        - db
        - source_id
        - created_at
        - updated_at

      properties:
        id:
          type: number

        db:
          $ref: '#/components/schemas/Db'

        source_id:
          type:
            - string
            - 'null'

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

    Submission:
      type: object
      additionalProperties: false

      required:
        - id
        - source_id
        - created_at
        - updated_at
        - accessions_count
        - ddbj_record
        - flatfile_na
        - flatfile_aa

      properties:
        id:
          type: number

        source_id:
          type:
            - string
            - 'null'

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

        accessions_count:
          type: number

        ddbj_record:
          $ref: '#/components/schemas/Attachment'

        flatfile_na:
          anyOf:
            - $ref: '#/components/schemas/Attachment'
            - type: 'null'

        flatfile_aa:
          anyOf:
            - $ref: '#/components/schemas/Attachment'
            - type: 'null'

    Accession:
      type: object
      additionalProperties: false

      required:
        - accession
        - entry_id
        - version
        - locus_date
        - status

      properties:
        accession:
          type: string

        entry_id:
          type: string

        status:
          $ref: '#/components/schemas/CurationStatus'

        version:
          type: number

        locus_date:
          type: string
          format: date

    Attachment:
      type: object
      additionalProperties: false
      required: [filename, url]

      properties:
        filename:
          type: string

        url:
          description: |
            Where to fetch the file. Good for one fetch, soon: it redirects to
            a storage URL that expires in minutes, and the redirect itself is
            authorised when it is followed — by the same rule that let you read
            the record it hangs off.

            So it is not a thing to store. A link kept from yesterday's listing
            does not work, and one handed to somebody else does not work for
            them, which is what makes access that has been taken away actually
            gone.
          type: string
          format: uri

    AttachedFile:
      description: |
        One file attached to a message. Uploaded directly to storage, so no
        size limit is imposed here — the files this conversation is about are
        submission files, which are large by nature.
      type: object
      additionalProperties: false

      required:
        - filename
        - byte_size
        - url

      properties:
        filename:
          type: string

        byte_size:
          type: number

        url:
          description: |
            Where to fetch the file. Good for one fetch, soon: it redirects to
            a storage URL that expires in minutes, and the redirect itself is
            authorised when it is followed — by the same rule that let you read
            the record it hangs off.

            So it is not a thing to store. A link kept from yesterday's listing
            does not work, and one handed to somebody else does not work for
            them, which is what makes access that has been taken away actually
            gone.
          type: string

    Message:
      type: object
      additionalProperties: false

      required:
        - id
        - body
        - author_role
        - author_uid
        - created_at
        - read_at
        - files

      properties:
        id:
          type: number

        body:
          type: string

        author_role:
          type: string

          enum:
            - curator
            - submitter

        author_uid:
          type: string

        created_at:
          type: string
          format: date-time

        read_at:
          type:
            - string
            - 'null'
          format: date-time

        files:
          type: array

          items:
            $ref: '#/components/schemas/AttachedFile'

    ReviewerAccession:
      type: object
      additionalProperties: false

      description: >
        What a share-token holder sees of an entry. Deliberately narrower than
        Accession: the token is unauthenticated, and where the entry stands in
        DDBJ's own handling of the submission is not a reviewer's business — the
        same reason the message thread is unreachable from a share link.

      required:
        - accession
        - entry_id
        - version
        - locus_date

      properties:
        accession:
          type: string

        entry_id:
          type: string

        version:
          type: number

        locus_date:
          type: string
          format: date

    CurationStatus:
      type: string

      description: >
        Where a curated row stands. `canceled` and `withdrawn` mean the row is no
        longer part of the submission: it is left out of the flatfile the next time
        one is generated, and should be left out of anything derived from it. The
        stored flatfile still contains it until then — the status is what changed,
        and regenerating is a separate run.

      enum:
        - submission_accepted
        - curating
        - accession_issued
        - private
        - public
        - withdrawn
        - canceled
        - permanently_suppressed
        - temporarily_suppressed

    SubmissionOperationStatus:
      type: string

      enum:
        - waiting_validation
        - validating
        - validation_failed
        - ready_to_apply
        - waiting_application
        - applying
        - applied
        - application_failed
        - no_change

    Error:
      type: object
      additionalProperties: false
      required: [error]

      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Unexpected parameter specified.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Not authenticated.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Does not have access rights to the resource.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: The requested resource could not be found.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnprocessableContent:
      description: Invalid parameter or payload was specified.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

