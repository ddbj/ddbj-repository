              schema:
                $ref: '#/components/schemas/Error'

        '404':
          $ref: '#/components/responses/NotFound'

        '422':
          description: That person has already joined.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sets/{set_id}/submissions:
    parameters:
      - name: set_id
        in: path
        required: true

        schema:
          type: number

    post:
      description: |
        Put submissions of yours in the set, which is what lets the set's
        members read them. Yours only — reading somebody else's through a
        shared set does not carry the right to hand it on, and an id you do
        not own answers 404 rather than being quietly dropped.

        Always a list; one submission is a list of one. The submitter's list
        screen adds a page's worth in a press, and splitting that into one
        request each would leave nobody holding the answer to what actually
        went in.

        Ones already in the set are counted, not refused: ten checkboxes
        where three are already there is an ordinary press.

      tags:
        - Sets

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [submission_request_ids]

              properties:
                submission_request_ids:
                  type: array
                  minItems: 1
                  maxItems: 200

                  items:
                    type: number

      responses:
        '200':
          description: |
            What happened, as counts. Not the set itself: answering with that
            would mean loading a page of it — a progress block and an accession
            summary per row — for something the client re-reads anyway. Both
            numbers, because "8 added" alone leaves somebody who checked ten
            wondering about the other two.

          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [added, already_in_set]

                properties:
                  added:
                    type: number

                  already_in_set:
                    type: number

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: Sets cannot be changed while acting as another account.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          $ref: '#/components/responses/NotFound'

        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /sets/{set_id}/submissions/{submission_request_id}:
    parameters:
      - name: set_id
        in: path
        required: true

        schema:
          type: number

      - name: submission_request_id
        in: path
        required: true

        schema:
          type: number

    delete:
      description: Take your submission back out of the set.

      tags:
        - Sets

      responses:
        '204':
          description: Removed.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true

        schema:
          type: string

    get:
      description: |
        What an invitation link is for, readable without an account — the
        person holding it may not have one yet. An expired invitation is
        answered rather than hidden: the holder is the intended recipient,
        and "ask them to send it again" is the only thing that unsticks them.

      security: []

      tags:
        - Sets

      responses:
        '200':
          description: The invitation.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{invitation_token}/acceptance:
    parameters:
      - name: invitation_token
        in: path
        required: true

        schema:
          type: string

    post:
      description: Walk through the invitation and join the set.

      tags:
        - Sets

      responses:
        '201':
          description: |
            The set you have joined — or were already in, if this invitation
            was a second one sent to the same person, in which case it is simply
            spent.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetSummary'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

        '422':
          description: The invitation has expired, or somebody has already used it.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /submission_requests/{submission_request_id}/files/{name}:
    parameters:
      - name: submission_request_id
        in: path
        required: true

        schema:
          type: number

      - name: name
        in: path
        required: true

        schema:
          type: string
          enum: [ddbj_record]

    get:
      description: |
        The file as uploaded. Readable by its submitter, by the members of any
        set it has been put in, and by nobody else — asked on every request,
        so access that has been taken away is a download that has stopped.

        The attachment is named by the path rather than carried as an opaque
        blob id, so one record's id cannot be presented with another record's
        file, and an attachment no path names cannot be addressed at all.

      tags:
        - Submission Requests

      parameters:
        - name: as
          in: query
          description: |
            `url` answers with the address as JSON instead of redirecting to it.
            A browser cannot put an `Authorization` header on an anchor and this
            API takes no cookies, so the web client asks for the address and
            navigates to it itself. Everything else follows the redirect.

          schema:
            type: string
            enum: [url]

        - name: disposition
          in: query

          description: |
            `attachment` saves the file; `inline` (the default) leaves it to the
            browser. A value outside this list is the default rather than an
            error — a disposition is a preference, not an instruction.

          schema:
            type: string
            enum: [inline, attachment]

      responses:
        '200':
          description: |
            The address, when `as=url` was asked for. A storage URL good for a
            few minutes — not a thing to store, and not usable by anybody the
            request was not authorised for.

          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]

                properties:
                  url:
                    type: string
                    format: uri

        '302':
          description: |
            A redirect to storage. The `Location` expires in minutes; the
            authorisation happened here, on this request.

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          $ref: '#/components/responses/NotFound'

  /submission_requests/{submission_request_id}/messages/{message_id}/files/{id}:
    parameters:
      - name: submission_request_id
